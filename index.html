<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Sim 3D Preview</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; font-family:sans-serif; touch-action:none; }
  canvas { display:block; }
  #credit {
    position: fixed; left:10px; bottom:8px;
    color: rgba(255,255,255,0.75); font-size:12px; letter-spacing:0.5px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #hint {
    position: fixed; right:10px; bottom:8px;
    color: rgba(255,255,255,0.6); font-size:11px; text-align:right;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #score {
    position: fixed; left:10px; top:10px;
    color: rgba(255,255,255,0.9); font: 14px monospace;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #popups {
    position: fixed; top:26%; left:0; width:100%; height:120px;
    pointer-events:none; overflow:visible;
  }
  .popup {
    position:absolute; left:50%; top:0; transform:translate(-50%,0);
    font:bold 22px sans-serif; text-shadow:0 2px 6px rgba(0,0,0,0.7);
    white-space:nowrap; animation: popupFloat 1.15s ease-out forwards;
  }
  @keyframes popupFloat {
    0%   { opacity:0; transform:translate(-50%,10px) scale(0.8); }
    15%  { opacity:1; transform:translate(-50%,-6px) scale(1.1); }
    100% { opacity:0; transform:translate(-50%,-70px) scale(1); }
  }
  #gameover {
    position: fixed; inset:0;
    background: rgba(0,0,0,0.55);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center;
  }
  #gameover.hidden { display:none; }
  #gameover .title { font-size:36px; font-weight:bold; font-family:sans-serif; }
  #gameover .sub { font-size:16px; margin-top:8px; font-family:sans-serif; }
</style>
</head>
<body>
<div id="score">score: 0</div>
<div id="popups"></div>
<div id="gameover" class="hidden">
  <div class="title">GAME OVER</div>
  <div class="sub">press the button to continue</div>
</div>
<div id="credit">By: @DecoyVR</div>
<div id="hint">drag: pitch/roll · tap: button<br>2-finger hold or Space: boost</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Tunables ----------
const MAX_PITCH_RATE = 1.3, MAX_ROLL_RATE = 2.2, MAX_YAW_RATE = 0.9; // rad/s
const SPEED = 150, DIVE_RANGE = 110, MIN_SPEED = 70, MAX_SPEED = 260; // world units / sec
const BOOST_BONUS = 150, MAX_BOOST_SPEED = 420;
const CHASE_DIST = 55, CHASE_HEIGHT = 20;
const PLAYER_RADIUS = 12, DRONE_RADIUS = 14;
const CHUNK_SIZE = 300, LOAD_RADIUS = 4, UNLOAD_BUFFER = 2;
const NORMAL_FOV = 70, BOOST_FOV = 84;

let pitch = 0, roll = 0, firstPerson = false, boostActive = false, wasBoosting = false;
let mode = 'play', score = 0, lastSpeed = SPEED;
let cumPitchAngle = 0, cumRollAngle = 0;
let lastTime = performance.now();
let dragging = false, lastX = 0, lastY = 0, moved = false;

let scene, camera, renderer, ground;
let dronePos = new THREE.Vector3(0,150,0);
let droneQuat = new THREE.Quaternion();
let playerDroneMesh;
let loadedChunks = new Map();
let trailPositions = [], trailLine, trailGeometry;

const scoreEl = document.getElementById('score');
const gameoverEl = document.getElementById('gameover');
const popupsEl = document.getElementById('popups');
const buildingColors = [0x8b96a6,0x7c8797,0xa9b4c4,0xc9b896,0x6b7686];

// ---------- Audio (Web Audio API, no external files) ----------
let audioCtx=null, engineOsc=null, engineGain=null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state==='suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.04;
    engineOsc.connect(engineGain).connect(audioCtx.destination);
    engineOsc.frequency.value = 70;
    engineOsc.start();
  } catch(e) {}
}
function playBeep(f0,f1,dur,type,vol) {
  if (!audioCtx) return;
  const o=audioCtx.createOscillator(); o.type=type||'sine';
  const g=audioCtx.createGain(); g.gain.value=vol||0.15;
  o.connect(g).connect(audioCtx.destination);
  const now=audioCtx.currentTime;
  o.frequency.setValueAtTime(f0,now);
  o.frequency.linearRampToValueAtTime(f1, now+dur);
  g.gain.setValueAtTime(vol||0.15, now);
  g.gain.linearRampToValueAtTime(0, now+dur);
  o.start(now); o.stop(now+dur);
}
document.addEventListener('touchstart', ensureAudio, { once:true });
document.addEventListener('mousedown', ensureAudio, { once:true });
document.addEventListener('click', ensureAudio, { once:true });

function showPopup(text,color) {
  const el = document.createElement('div');
  el.className = 'popup';
  el.textContent = text;
  el.style.color = color || '#ffd21f';
  el.style.marginLeft = (Math.random()*40-20)+'px';
  popupsEl.appendChild(el);
  setTimeout(()=>el.remove(),1150);
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x6fb1e6);
  scene.fog = new THREE.Fog(0x6fb1e6, 350, 1150);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 1, 3000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(300,500,200);
  scene.add(sun);

  ground = new THREE.Mesh(
    new THREE.PlaneGeometry(6000,6000),
    new THREE.MeshLambertMaterial({ color: 0x53565f })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  playerDroneMesh = makePlaneModel(0xe2e8f0);
  scene.add(playerDroneMesh);

  trailGeometry = new THREE.BufferGeometry();
  const trailMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.35 });
  trailLine = new THREE.Line(trailGeometry, trailMaterial);
  scene.add(trailLine);

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ---------- Procedural infinite city ----------
function seededRandomFn(cx,cz) {
  let seed = (cx*374761393 ^ cz*668265263) >>> 0;
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = (t + Math.imul(t ^ t>>>7, 61 | t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

function createBuilding(x,z,rng) {
  const w=30+rng()*40, d=30+rng()*40, h=60+rng()*260;
  const color = buildingColors[Math.floor(rng()*buildingColors.length)];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({ color }));
  mesh.position.set(x,h/2,z);
  scene.add(mesh);
  const lot = new THREE.Mesh(new THREE.BoxGeometry(w+16,2,d+16), new THREE.MeshLambertMaterial({ color: 0x8f9aa0 }));
  lot.position.set(x,1,z);
  scene.add(lot);
  return { objects:[mesh,lot], data:{ x, z, w, d, h } };
}

function createTree(x,z) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(2,2,10,6), new THREE.MeshLambertMaterial({ color: 0x6b4a2f }));
  trunk.position.set(x,5,z);
  scene.add(trunk);
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(9,22,7), new THREE.MeshLambertMaterial({ color: 0x3f7d3a }));
  leaf.position.set(x,21,z);
  scene.add(leaf);
  return [trunk,leaf];
}

function makePlaneModel(color) {
  const g = new THREE.Group();
  const trimMat = new THREE.MeshLambertMaterial({ color: 0x2d3748 });
  const propMat = new THREE.MeshLambertMaterial({ color: 0x1a202c, side: THREE.DoubleSide });

  const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.8,20,8), new THREE.MeshLambertMaterial({ color }));
  fuselage.rotation.x = Math.PI/2;
  g.add(fuselage);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(2.2,6,8), new THREE.MeshLambertMaterial({ color }));
  nose.rotation.x = -Math.PI/2;
  nose.position.z = -13;
  g.add(nose);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(34,1,7), trimMat);
  wing.position.set(0,0,-1);
  g.add(wing);

  const vFin = new THREE.Mesh(new THREE.BoxGeometry(1,7,6), trimMat);
  vFin.position.set(0,4,9);
  g.add(vFin);

  const hStab = new THREE.Mesh(new THREE.BoxGeometry(14,1,5), trimMat);
  hStab.position.set(0,0,9);
  g.add(hStab);

  const prop = new THREE.Mesh(new THREE.CircleGeometry(3.5,8), propMat);
  prop.position.z = -16;
  g.add(prop);

  const flame = new THREE.Mesh(new THREE.ConeGeometry(2,11,8), new THREE.MeshBasicMaterial({ color: 0xff8c00 }));
  flame.rotation.x = Math.PI/2;
  flame.position.z = 16;
  flame.visible = false;
  g.add(flame);
  g.userData.flame = flame;

  g.userData.propellers = [prop];
  return g;
}

function generateChunk(cx,cz) {
  const key = cx+','+cz;
  if (loadedChunks.has(key)) return;
  const rng = seededRandomFn(cx,cz);
  const originX = cx*CHUNK_SIZE, originZ = cz*CHUNK_SIZE;
  const record = { objects:[], buildingEntries:[], droneEntries:[], carEntries:[], ringEntries:[] };

  const cellsPerSide = 2, cellSize = CHUNK_SIZE/cellsPerSide;
  for (let ix=0; ix<cellsPerSide; ix++) {
    for (let iz=0; iz<cellsPerSide; iz++) {
      const x = originX + ix*cellSize + cellSize/2 + (rng()-0.5)*20;
      const z = originZ + iz*cellSize + cellSize/2 + (rng()-0.5)*20;
      if (Math.sqrt(x*x+z*z) < 110) continue;
      const r = rng();
      if (r < 0.12) {
        record.objects.push(...createTree(x,z));
      } else if (r < 0.77) {
        const b = createBuilding(x,z,rng);
        record.objects.push(...b.objects);
        record.buildingEntries.push(b.data);
      }
    }
  }
  if (rng() < 0.35) {
    const dx = originX + rng()*CHUNK_SIZE, dz = originZ + rng()*CHUNK_SIZE, dy = 40+rng()*280;
    const mesh = makePlaneModel(0xf56565);
    mesh.position.set(dx,dy,dz);
    scene.add(mesh);
    record.objects.push(mesh);
    record.droneEntries.push({ x:dx, y:dy, z:dz, mesh, bob: rng()*Math.PI*2 });
  }
  if (rng() < 0.3) {
    const colors = [0xe53e3e,0xecc94b,0x3182ce,0xffffff];
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(10,6,18), new THREE.MeshLambertMaterial({ color: colors[Math.floor(rng()*colors.length)] }));
    const axis = rng() < 0.5 ? 'x' : 'z';
    const lane = originZ + CHUNK_SIZE/2;
    const start = originX + rng()*CHUNK_SIZE;
    mesh.position.set(axis==='x'?start:lane, 4, axis==='x'?lane:start);
    if (axis==='z') mesh.rotation.y = Math.PI/2;
    scene.add(mesh);
    record.objects.push(mesh);
    record.carEntries.push({ mesh, axis, pos:start, speed:30+rng()*30 });
  }
  if (rng() < 0.4) {
    const rx = originX + rng()*CHUNK_SIZE, rz = originZ + rng()*CHUNK_SIZE, ry = 50+rng()*220;
    const axis = rng() < 0.5 ? 'z' : 'x';
    const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(18,2.2,8,20), new THREE.MeshLambertMaterial({ color: 0xffd21f }));
    ringMesh.position.set(rx,ry,rz);
    if (axis==='x') ringMesh.rotation.y = Math.PI/2;
    scene.add(ringMesh);
    record.objects.push(ringMesh);
    record.ringEntries.push({ x:rx, y:ry, z:rz, axis, mesh:ringMesh, collected:false });
  }

  loadedChunks.set(key, record);
}

function ensureChunksLoaded() {
  const pcx = Math.floor(dronePos.x/CHUNK_SIZE);
  const pcz = Math.floor(dronePos.z/CHUNK_SIZE);
  for (let dx=-LOAD_RADIUS; dx<=LOAD_RADIUS; dx++)
    for (let dz=-LOAD_RADIUS; dz<=LOAD_RADIUS; dz++)
      generateChunk(pcx+dx, pcz+dz);

  const toUnload = [];
  for (const key of loadedChunks.keys()) {
    const [cx,cz] = key.split(',').map(Number);
    if (Math.max(Math.abs(cx-pcx), Math.abs(cz-pcz)) > LOAD_RADIUS+UNLOAD_BUFFER) toUnload.push(key);
  }
  toUnload.forEach(key => {
    const record = loadedChunks.get(key);
    record.objects.forEach(o => scene.remove(o));
    loadedChunks.delete(key);
  });
}

function updateWorld(dt) {
  const dtS = dt/1000;
  const t = performance.now();
  for (const record of loadedChunks.values()) {
    record.droneEntries.forEach(d => {
      d.mesh.position.y = d.y + Math.sin(t/600 + d.bob) * 6;
      d.mesh.userData.propellers.forEach(p => p.rotation.z += dt*0.02);
    });
    record.carEntries.forEach(c => {
      c.pos += c.speed*dtS;
      if (c.axis==='x') c.mesh.position.x = c.pos; else c.mesh.position.z = c.pos;
    });
  }
  playerDroneMesh.userData.propellers.forEach(p => p.rotation.z += dt*0.03);
  ground.position.set(dronePos.x, 0, dronePos.z);
}

function updateTrail() {
  const tailOffset = new THREE.Vector3(0,0,12).applyQuaternion(droneQuat);
  trailPositions.push(dronePos.clone().add(tailOffset));
  if (trailPositions.length > 40) trailPositions.shift();
  const arr = new Float32Array(trailPositions.length*3);
  trailPositions.forEach((p,i) => { arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z; });
  trailGeometry.setAttribute('position', new THREE.BufferAttribute(arr,3));
}

function checkCollisions() {
  for (const record of loadedChunks.values()) {
    for (const b of record.buildingEntries) {
      const dx=dronePos.x-b.x, dz=dronePos.z-b.z;
      if (Math.abs(dx) < b.w/2+PLAYER_RADIUS && Math.abs(dz) < b.d/2+PLAYER_RADIUS &&
          dronePos.y < b.h+PLAYER_RADIUS && dronePos.y > -PLAYER_RADIUS) return true;
    }
    for (const d of record.droneEntries) {
      const dx=dronePos.x-d.x, dy=dronePos.y-d.y, dz=dronePos.z-d.z;
      if (dx*dx+dy*dy+dz*dz < (DRONE_RADIUS+PLAYER_RADIUS)**2) return true;
    }
  }
  return dronePos.y <= 2;
}

function checkRings() {
  for (const record of loadedChunks.values()) {
    for (const r of record.ringEntries) {
      if (r.collected) continue;
      const nx = r.axis==='x' ? 1:0, nz = r.axis==='z' ? 1:0;
      const relX=dronePos.x-r.x, relY=dronePos.y-r.y, relZ=dronePos.z-r.z;
      const along = relX*nx + relZ*nz;
      if (Math.abs(along) > 16) continue;
      const latX = relX - nx*along, latZ = relZ - nz*along;
      const latDist = Math.sqrt(latX*latX + relY*relY + latZ*latZ);
      if (latDist < 15) {
        r.collected = true;
        r.mesh.visible = false;
        score += 50;
        showPopup('RING +50', '#ffd21f');
        playBeep(600,1200,0.15,'sine',0.15);
      }
    }
  }
}

function resetGame() {
  score = 0; mode = 'play';
  dronePos.set(0,150,0);
  droneQuat.identity();
  cumPitchAngle = 0; cumRollAngle = 0;
  trailPositions = [];
}

const _tmpQuat = new THREE.Quaternion();
const _axisX = new THREE.Vector3(1,0,0);
const _axisZ = new THREE.Vector3(0,0,1);
const _worldY = new THREE.Vector3(0,1,0);
const _fwd = new THREE.Vector3(0,0,-1); // Three.js cameras look down -Z by default

function update(dt) {
  ensureChunksLoaded();
  updateWorld(dt);
  if (mode !== 'play') return;

  const dtS = dt/1000;
  const pInput = Math.max(-45, Math.min(45, pitch)) / 45;
  const rInput = Math.max(-45, Math.min(45, roll)) / 45;

  const pitchDelta = pInput*MAX_PITCH_RATE*dtS;
  const rollDelta = -rInput*MAX_ROLL_RATE*dtS;
  _tmpQuat.setFromAxisAngle(_axisX, pitchDelta); droneQuat.multiply(_tmpQuat);
  _tmpQuat.setFromAxisAngle(_axisZ, rollDelta); droneQuat.multiply(_tmpQuat);

  cumPitchAngle += pitchDelta;
  cumRollAngle += rollDelta;
  if (Math.abs(cumPitchAngle) >= Math.PI*2) {
    score += 50; showPopup('LOOP! +50', '#63f5a1'); playBeep(500,900,0.2,'triangle',0.15);
    cumPitchAngle -= Math.sign(cumPitchAngle)*Math.PI*2;
  }
  if (Math.abs(cumRollAngle) >= Math.PI*2) {
    score += 50; showPopup('BARREL ROLL! +50', '#63c7f5'); playBeep(500,900,0.2,'triangle',0.15);
    cumRollAngle -= Math.sign(cumRollAngle)*Math.PI*2;
  }

  const right = new THREE.Vector3(1,0,0).applyQuaternion(droneQuat);
  const yawAmount = -right.y * MAX_YAW_RATE * dtS;
  _tmpQuat.setFromAxisAngle(_worldY, yawAmount);
  droneQuat.premultiply(_tmpQuat);

  const forward = _fwd.clone().applyQuaternion(droneQuat);
  const diveFactor = -forward.y;
  lastSpeed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, SPEED + diveFactor*DIVE_RANGE));
  if (boostActive) lastSpeed = Math.min(MAX_BOOST_SPEED, lastSpeed + BOOST_BONUS);
  if (boostActive && !wasBoosting) playBeep(200,900,0.25,'sawtooth',0.2);
  wasBoosting = boostActive;
  playerDroneMesh.userData.flame.visible = boostActive;
  trailLine.material.color.set(boostActive ? 0xffa500 : 0xffffff);
  dronePos.addScaledVector(forward, lastSpeed*dtS);

  updateTrail();
  checkRings();
  score += dt*0.01;

  if (checkCollisions()) {
    mode = 'crashed';
    playBeep(300,60,0.4,'sawtooth',0.2);
  }
}

function updateCameraAndDrone() {
  if (firstPerson) {
    camera.position.copy(dronePos);
    camera.quaternion.copy(droneQuat);
    playerDroneMesh.visible = false;
  } else {
    const offset = new THREE.Vector3(0,CHASE_HEIGHT,CHASE_DIST).applyQuaternion(droneQuat);
    camera.position.copy(dronePos).add(offset);
    camera.quaternion.copy(droneQuat);
    playerDroneMesh.visible = true;
    playerDroneMesh.position.copy(dronePos);
    playerDroneMesh.quaternion.copy(droneQuat);
  }
}

function handleButtonPress() {
  if (mode === 'crashed') resetGame();
  else firstPerson = !firstPerson;
}

// --- input: drag to tilt (release to recenter), tap for the button ---
window.addEventListener('mousedown', e => { dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => { dragging = false; pitch = 0; roll = 0; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  roll = Math.max(-45, Math.min(45, roll + (e.clientX - lastX) * 0.5));
  pitch = Math.max(-45, Math.min(45, pitch - (e.clientY - lastY) * 0.4));
  if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 3) moved = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('click', () => { if (!moved) handleButtonPress(); });

window.addEventListener('touchstart', e => {
  const t = e.touches[0];
  dragging = true; moved = false; lastX = t.clientX; lastY = t.clientY;
  boostActive = e.touches.length >= 2;
  e.preventDefault();
}, { passive:false });
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  roll = Math.max(-45, Math.min(45, roll + (t.clientX - lastX) * 0.5));
  pitch = Math.max(-45, Math.min(45, pitch - (t.clientY - lastY) * 0.4));
  if (Math.abs(t.clientX - lastX) + Math.abs(t.clientY - lastY) > 3) moved = true;
  lastX = t.clientX; lastY = t.clientY;
  boostActive = e.touches.length >= 2;
  e.preventDefault();
}, { passive:false });
window.addEventListener('touchend', e => {
  dragging = false; pitch = 0; roll = 0;
  boostActive = e.touches.length >= 2;
  if (!moved) handleButtonPress();
  e.preventDefault();
}, { passive:false });
window.addEventListener('keydown', e => { if (e.code === 'Space') { boostActive = true; e.preventDefault(); } });
window.addEventListener('keyup', e => { if (e.code === 'Space') boostActive = false; });

function animate(now) {
  const dt = now - lastTime; lastTime = now;
  update(dt);
  updateCameraAndDrone();
  renderer.render(scene, camera);

  camera.fov += ((boostActive ? BOOST_FOV : NORMAL_FOV) - camera.fov) * 0.12;
  camera.updateProjectionMatrix();

  if (engineOsc) engineOsc.frequency.setTargetAtTime(60+lastSpeed*0.55, audioCtx.currentTime, 0.05);

  scoreEl.textContent = 'score: ' + Math.floor(score) + '   speed: ' + Math.floor(lastSpeed);
  gameoverEl.classList.toggle('hidden', mode !== 'crashed');

  requestAnimationFrame(animate);
}

init();
requestAnimationFrame(animate);
</script>
</body>
</html>
